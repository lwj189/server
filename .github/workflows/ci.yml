name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 严格编译 + 测试（p2 23 / epoll 23+4 / keepalive 7 / emfile 2）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示环境信息
        run: |
          uname -a
          g++ --version | head -1
          python3 --version

      # 两个源文件都要"零警告"，否则算失败（和本地同一条命令）
      - name: 严格编译 p2.cpp 和 epoll.cpp（有警告就算失败）
        run: |
          FAIL=0
          for src in p2 epoll; do
            echo "================ 编译 $src.cpp ================"
            if ! g++ -std=c++17 -Wall -Wextra -Wformat=2 -Wconversion "$src.cpp" -o "$src" 2> build.log; then
              echo "::error::$src.cpp 编译失败"
              cat build.log
              FAIL=1
              continue
            fi
            if [ -s build.log ]; then
              echo "::error::$src.cpp 编译有警告，先修干净再提交"
              cat build.log
              FAIL=1
              continue
            fi
            echo "OK: $src.cpp 编译通过（零错误零警告）"
          done
          exit $FAIL

      # ⚠ p2 和 epoll 都监听 8888，所以只能【串行】：
      #   起一个 → 等 LISTEN → 跑测试 → 杀掉 → 等端口释放 → 再起下一个
      # 一个失败不影响另一个继续跑（最后统一看 RC），这样一次 CI 能同时看到全部结果
      #
      # 两套测试的分工（正交，都要绿）：
      #   p2_test.py      【协议正确性】回答对不对 —— 对 p2 和 epoll 都跑
      #   balance_test.py 【资源配平】东西有没有还回去（fd + 账本）—— 只对 epoll 跑
      - name: 跑测试（p2 23 项 / epoll 23 项 + 配平 4 项）
        run: |
          RC=0

          run_one() {
            local bin="$1"; shift
            local tests="$*"

            echo "================================================================"
            echo " 服务器 ./$bin   ←   $tests"
            echo "================================================================"

            rm -f server.log
            ./"$bin" > server.log 2>&1 &
            local pid=$!
            echo "服务器已启动 pid=$pid，等待进入 LISTEN ..."

            local up=0
            for _ in $(seq 1 25); do
              if ss -tln 2>/dev/null | grep -q ':8888 '; then up=1; break; fi
              sleep 0.2
            done

            if [ "$up" -ne 1 ]; then
              echo "::error::./$bin 没有进入 LISTEN"
              cat server.log
              kill "$pid" 2>/dev/null || true
              RC=1
              return
            fi
            echo "---- 监听状态 ----"
            ss -tlnp 2>/dev/null | grep 8888

            for t in $tests; do
              echo "-------- $t --------"
              case "$t" in
                # 配平测试要 pid 才能读 /proc/<pid>/fd，要日志才能查哨兵有没有响；
                # 它自己也会校验"这个 pid 确实是 8888 的监听者"，防止量错进程
                *balance_test.py) python3 "$t" --pid "$pid" --log server.log || RC=1 ;;
                *)                python3 "$t" || RC=1 ;;
              esac
            done

            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true

            echo "---- ./$bin 服务器日志（末尾 15 行）----"
            tail -15 server.log
            echo

            # 等端口真正释放，否则下一个服务器会 bind: Address already in use
            for _ in $(seq 1 25); do
              if ! ss -tln 2>/dev/null | grep -q ':8888 '; then break; fi
              sleep 0.2
            done
          }

          run_one p2    tests/p2_test.py
          run_one epoll tests/p2_test.py tests/balance_test.py

          exit $RC

      # 下面这两套【自己起服务器】（keepalive 要读服务器日志确认处理了哪个请求；
      # emfile 要先把 ulimit -n 压低再启动），所以必须等上面的服务器都杀掉之后再跑。
      # 它们启动前会检查 8888 是否空闲 —— 被占用就直接退出码 2，这才是对的：
      # 宁可报"环境不对"，也不能连到别人的服务器上跑出一片假绿。
      - name: 跑"自己起服务器"的两套（keepalive 7 项 + emfile 2 项）
        run: |
          RC=0
          echo "-------- tests/keepalive_test.py --------"
          python3 tests/keepalive_test.py || RC=1
          echo "-------- tests/emfile_test.py --------"
          python3 tests/emfile_test.py || RC=1
          exit $RC
