name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 严格编译 + 两套测试（p2 23 项 / CP6b 4 项）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示环境信息
        run: |
          uname -a
          g++ --version | head -1
          python3 --version

      # 两个源文件都要"零警告"，否则算失败（和本地同一条命令）
      - name: 严格编译 p2.cpp 和 epoll.cpp（有警告就算失败）
        run: |
          FAIL=0
          for src in p2 epoll; do
            echo "================ 编译 $src.cpp ================"
            if ! g++ -std=c++17 -Wall -Wextra -Wformat=2 -Wconversion "$src.cpp" -o "$src" 2> build.log; then
              echo "::error::$src.cpp 编译失败"
              cat build.log
              FAIL=1
              continue
            fi
            if [ -s build.log ]; then
              echo "::error::$src.cpp 编译有警告，先修干净再提交"
              cat build.log
              FAIL=1
              continue
            fi
            echo "OK: $src.cpp 编译通过（零错误零警告）"
          done
          exit $FAIL

      # ⚠ p2 和 epoll 都监听 8888，所以只能【串行】：
      #   起一个 → 等 LISTEN → 跑测试 → 杀掉 → 等端口释放 → 再起下一个
      # 一个失败不影响另一个继续跑（最后统一看 RC），这样一次 CI 能同时看到两套结果
      - name: 跑两套测试（p2 23 项 + CP6b 4 项）
        run: |
          RC=0

          run_one() {
            local bin="$1" test="$2"

            echo "================================================================"
            echo " $test    （服务器：./$bin）"
            echo "================================================================"

            ./"$bin" > server.log 2>&1 &
            local pid=$!
            echo "服务器已启动 pid=$pid，等待进入 LISTEN ..."

            local up=0
            for _ in $(seq 1 25); do
              if ss -tln 2>/dev/null | grep -q ':8888 '; then up=1; break; fi
              sleep 0.2
            done

            if [ "$up" -ne 1 ]; then
              echo "::error::./$bin 没有进入 LISTEN"
              cat server.log
              kill "$pid" 2>/dev/null || true
              RC=1
              return
            fi
            echo "---- 监听状态 ----"
            ss -tlnp 2>/dev/null | grep 8888

            # cp6b_test.py 的 [4] 要读 /proc/<pid>/fd 来数 fd，
            # 所以显式把 pid 传给它（它自己也能用 ss 猜，但显式更稳）；
            # p2_test.py 没有 --pid 这个参数，直接跑
            if [ "$test" = "tests/cp6b_test.py" ]; then
              python3 "$test" --pid "$pid" || RC=1
            else
              python3 "$test" || RC=1
            fi

            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true

            echo "---- ./$bin 服务器日志（末尾 15 行）----"
            tail -15 server.log
            echo

            # 等端口真正释放，否则下一个服务器会 bind: Address already in use
            for _ in $(seq 1 25); do
              if ! ss -tln 2>/dev/null | grep -q ':8888 '; then break; fi
              sleep 0.2
            done
          }

          run_one p2    tests/p2_test.py
          run_one epoll tests/cp6b_test.py

          exit $RC
